spring.application.name=EARLY-test

# In-Memory H2 DataSource in PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:earlydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations for Test
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Project EARLY Properties
early.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
early.jwt.access-token-expiration=900000
early.jwt.refresh-token-expiration=604800000
early.storage.upload-dir=./target/test-storage/reports
early.ocr.service-url=http://localhost:8000
early.cors.allowed-origins=http://localhost:3000
